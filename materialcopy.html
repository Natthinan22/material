    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const abmientLight = new THREE.AmbientLight(0x404040, 1); // soft white light
        scene.add(abmientLight);

        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);


        
        const exrSkyboxUrl = 'https://natthinan22.github.io/Transformation/ferndale_studio_12_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geom.computeVertexNormals();

        const tex = new THREE.TextureLoader().load('https://sibsansuk.github.io/5241_Capheny2.png', t => {
        });
        const mat = new THREE.MeshStandardMaterial({
            map: tex
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        //scene.add(mesh);


        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://natthinan22.github.io/Transformation/alex-lvrs-Md6_qA-BMis-unsplash.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

        // basic shader sphere
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32 );
        const sphereMaterial = new THREE.MeshBasicMaterial({

            color : 0xff0000
        });
        const sphere = new THREE.Mesh(sphereGeometry,sphereMaterial);
        sphere.position.set(2,1,-2);
        sphere.castShadow = true ;
        scene.add(sphere);

        // lamber sphere 
        const lambertsphereGeometry = new THREE.SphereGeometry(0.5, 32, 32 );
        const lambertsphereMaterial = new THREE.MeshLambertMaterial({

            color : 0xffff00
        });
        const lambertsphere = new THREE.Mesh(lambertsphereGeometry,lambertsphereMaterial);
        lambertsphere.position.set(0,1,-2);
        lambertsphere.castShadow = true ;
        scene.add(lambertsphere);

        // phong สะท้อนแสง
        const phongSphereGeometry = new THREE.SphereGeometry(0.5, 32, 32 );
        const phongsphereMaterial = new THREE.MeshPhongMaterial({

            color : 0xff00ff,
            shininess : 100 
        });
        const phongsphere = new THREE.Mesh(phongSphereGeometry,phongsphereMaterial);
        phongsphere.position.set(-2,1,-2);
        phongsphere.castShadow = true ;
        scene.add(phongsphere);

        // standardmaterial  PBR
        const pbrSphereGeometry = new THREE.SphereGeometry(0.5, 32, 32 );
        const pbrspherematerial = new THREE.MeshStandardMaterial({

            color : 0x00FFFF,
            metalness : 0.9 , 
            roughness : 0.1  // ความด้านของวัตถุ
        });
        const pbrsphere = new THREE.Mesh(pbrSphereGeometry,pbrspherematerial);
        pbrsphere.position.set(0,1,2);
        pbrsphere.castShadow = true ;
        scene.add(pbrsphere);

        //load glb และใช้ pbr material
        const loader = new THREE.GLTFLoader();
        loader.load('https://natthinan22.github.io/Transformation/angella.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 1.5, 0);
            scene.add(model);
        });

        const mouseLightRaycaster = new THREE.Raycaster();
        const mouseNDC = new THREE.Vector2();

        // ระนาบแนวนอนสมมติที่ y = 3 ไว้หาจุดตัดกับเมาส์ 
        const lightPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3);
        const lightIntersectPoint = new THREE.Vector3();

        // กลมๆให้เห็นแสง
        const lightIndicatorGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const lightIndicatorMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const lightIndicator = new THREE.Mesh(lightIndicatorGeo, lightIndicatorMat);
        scene.add(lightIndicator);

        // PointLight 
        const mouseLight = new THREE.PointLight(0xffffff, 1.5, 20);
        mouseLight.castShadow = true;
        scene.add(mouseLight);

        scene.add(directionalLight.target);

        function onMouseMoveLight(event) {
            // ตำแหน่งเมาส์ 
            mouseNDC.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(event.clientY / window.innerHeight) * 2 + 1;

            mouseLightRaycaster.setFromCamera(mouseNDC, camera);

            const hit = mouseLightRaycaster.ray.intersectPlane(lightPlane, lightIntersectPoint);

            if (hit) {
                mouseLight.position.copy(lightIntersectPoint);
                lightIndicator.position.copy(lightIntersectPoint);

                directionalLight.position.copy(lightIntersectPoint);
                directionalLight.target.position.set(0, 0, 0);
            }
        }

        window.addEventListener('mousemove', onMouseMoveLight);

        const guiScriptTag = document.createElement('script');
        guiScriptTag.src = 'https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js';
        document.head.appendChild(guiScriptTag);

        guiScriptTag.onload = () => {
            const gui = new dat.GUI();

            const lightParams = {
                height: 3,
                mouseLightIntensity: mouseLight.intensity,
                directionalIntensity: directionalLight.intensity,
                color: '#ffffff'
            };

            gui.add(lightParams, 'height', 0.5, 10).name('Height(y)').onChange((val) => {
                lightPlane.constant = -val;
            });

            gui.add(lightParams, 'mouseLightIntensity', 0, 6).name('PointLight').onChange((val) => {
                mouseLight.intensity = val;
            });

            gui.add(lightParams, 'directionalIntensity', 0, 3).name('DirectionalLight').onChange((val) => {
                directionalLight.intensity = val;
            });

            gui.addColor(lightParams, 'color').name('color').onChange((val) => {
                mouseLight.color.set(val);
                directionalLight.color.set(val);
                lightIndicatorMat.color.set(val);
            });
        };

      
        function animate(t) {
            mesh.rotation.y = Math.sin(t * 0.001);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
